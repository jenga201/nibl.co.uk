name: niblcouk

services:
  niblcouk:
    build:
      context: .
      dockerfile: Dockerfile
    image: niblcouk
    container_name: niblcouk
    working_dir: /var/www/html
    command: ["/var/www/html/etc/docker/start-apache"]
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      APP_KEY: ${WEB_APP_KEY:?Set WEB_APP_KEY in .env}
      APP_URL: ${WEB_APP_URL:-https://www.nibl.co.uk}
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: ${SQL_HOST:-niblmysql}
      DB_PORT: ${SQL_PORT:-3306}
      DB_DATABASE: ${SQL_DATABASE:-ooinuza}
      DB_USERNAME: ${SQL_USER:?Set SQL_USER in .env}
      DB_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
      SESSION_DRIVER: file
      SESSION_LIFETIME: "60"
      SESSION_COOKIE: nibl-web
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: single
      LOG_LEVEL: ${WEB_LOG_LEVEL:-info}
      NIBL_DATA_CACHE: ${WEB_DATA_CACHE:-apcu}
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - ./var:/var/www/html/var
    logging:
      driver: json-file
      options:
        max-size: "250m"
        max-file: "3"
    networks:
      - my-bridge

networks:
  my-bridge:
    external: true
